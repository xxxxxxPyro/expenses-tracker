version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: expenses_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-expenses}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-expensespass}
      POSTGRES_DB: ${DB_NAME:-expenses_tracker}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-expenses} -d ${DB_NAME:-expenses_tracker}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..        # ← one level up from ./docker
      dockerfile: deployments/Dockerfile
    container_name: expenses_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: ../.env
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../app:/app/app

  bot:
    build:
      context: ..        # ← one level up from ./docker
      dockerfile: deployments/Dockerfile
    container_name: expenses_bot
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: ../.env
    network_mode: host
    volumes:
      - ../app:/app/app
    command: python -m app.telegram_bot

volumes:
  pgdata: